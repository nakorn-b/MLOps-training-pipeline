# generic metadata
prefect-version: null
name: MLOps-training-pipeline

# preparation steps
build: null
push: null

# runtime steps
# The worker container (docker-compose.yaml) mounts the project at /app.
# Without this, `prefect deploy` would record this machine's absolute path.
pull:
- prefect.deployments.steps.set_working_directory:
    directory: /app

# deployment configurations
deployments:
- # base metadata
  name: train_pipeline
  version: null
  tags: ["train"]
  description: null

  # flow-specific fields
  entrypoint: pipeline/flow.py:train
  parameters: {}

  # infra-specific fields
  work_pool:
    name: mlops-pipeline
    work_queue_name: null
    job_variables: {}